<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    var params = new URLSearchParams(location.search);

    // Firmwares this build has a MEASURED kernel table for. jb.js still runs its
    // own kernel-table-present gate, so this is UX only -- an unlisted firmware
    // can still be launched with a tap. KEEP IN SYNC with ps4_offsets.js: add a
    // fwnum here in the SAME commit that fills that firmware's kernel RVAs.
    // The PS4 reports its minor as two hex digits in the UA (13.52 -> minor 0x52).
    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 }; // all measured on hardware

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var forced = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);
    detEl.innerHTML = "firmware <b>" + (key || "unknown") + "</b>"
        + (supported ? " &middot; <b>supported</b>"
                     : " &middot; not in this build's kernel table");

    var target = "jb.html" + location.search;
    function go() { setState("Initializing GoldHen exploit...", "warn"); location.replace(target); }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    // Off-target consoles are not launched automatically -- one tap still runs
    // it, so a user-agent quirk on the real 13.52 console can never lock it out.
    if (!supported) {
        setState("I cant Jailbreak this firmware", "bad");
        waitForTap("UNSUPPORTED (" + (key || "unknown") + ") -- press X or tap to run anyway", go);
        return;
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("offline -- from cache", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("cached", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("update downloaded", true);
        waitForTap("UPDATE READY -- press X or tap to reload & run",
                   function () { location.reload(); });
    } else {
        setCache("checking cache...");
        ac.addEventListener("downloading",
            function () { setCache("Caching for offline (first run)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("caching " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);
        ac.addEventListener("cached", function () {
            setCache("cached for offline use", true);
            waitForTap("CACHED (first run) -- press X or tap to run", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("update downloaded", true);
            waitForTap("UPDATE READY -- press X or tap to reload & run",
                       function () { location.reload(); });
        }, false);
        ac.addEventListener("noupdate", function () {
            setCache("cached -- offline ready", true);
            go();
        }, false);
        ac.addEventListener("error", function () {
            setCache("cache unavailable");
            waitForTap("CACHE FAILED -- press X or tap to run anyway", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("cache obsolete");
            waitForTap("CACHE OBSOLETE -- press X or tap to run", go);
        }, false);
    }
})();
</script>
<script>

(() => {
  const canvas = document.getElementById('xmb-waves');
  const ctx = canvas && canvas.getContext('2d');
  if (!ctx) return;

  let w = 0, h = 0, dpr = 1, raf;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function draw(time) {
    const t = time * 0.00022;
    ctx.clearRect(0, 0, w, h);

    // Deep midnight blue with a soft PS3-era violet glow.
    const bg = ctx.createRadialGradient(w * .32, h * .48, 0, w * .42, h * .5, Math.max(w, h) * .85);
    bg.addColorStop(0, '#11132b');
    bg.addColorStop(.48, '#080a18');
    bg.addColorStop(1, '#030409');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, w, h);

    // Layered, fine silk ribbons inspired by the original PS3 XMB wave.
    const layers = [
      {amp: h*.105, base: h*.60, freq: 1.05, phase: 0.0, color: '64,105,255', alpha:.18, width:2.1},
      {amp: h*.085, base: h*.63, freq: 1.28, phase: 1.4, color: '107,87,255', alpha:.22, width:1.6},
      {amp: h*.12,  base: h*.57, freq: .82, phase: 2.5, color: '48,164,255', alpha:.13, width:1.2},
      {amp: h*.07,  base: h*.66, freq: 1.55, phase: 3.7, color: '154,113,255', alpha:.16, width:1.1},
      {amp: h*.095, base: h*.61, freq: 1.12, phase: 5.1, color: '94,143,255', alpha:.12, width:.9}
    ];

    for (let li = 0; li < layers.length; li++) {
      const L = layers[li];
      ctx.beginPath();
      for (let x = -4; x <= w + 4; x += 4) {
        const u = x / Math.max(w, 1);
        const envelope = Math.sin(Math.PI * u) * .45 + .55;
        const y = L.base
          + Math.sin(u * Math.PI * 2 * L.freq + t * (1.0 + li*.08) + L.phase) * L.amp * envelope
          + Math.sin(u * Math.PI * 4.1 - t * .7 + L.phase) * L.amp * .22
          + (u - .5) * h * .08;
        if (x === -4) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = `rgba(${L.color},${L.alpha})`;
      ctx.lineWidth = L.width;
      ctx.shadowColor = `rgba(${L.color},.45)`;
      ctx.shadowBlur = li < 3 ? 13 : 6;
      ctx.stroke();
    }

    // Broad translucent wave bands give the lines a silky, flowing body.
    for (let i = 0; i < 3; i++) {
      const phase = t * (.72 + i*.12) + i * 2.1;
      ctx.beginPath();
      for (let x = -3; x <= w + 3; x += 5) {
        const u = x / Math.max(w, 1);
        const y = h*.61
          + Math.sin(u * Math.PI * (1.2 + i*.16) + phase) * h*(.105 + i*.012)
          + Math.sin(u * Math.PI * 3.4 - phase*.8 + i) * h*.035;
        if (x === -3) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      const glow = ctx.createLinearGradient(0, h*.42, 0, h*.78);
      glow.addColorStop(0, `rgba(${i===1?'85,110,255':'92,79,220'},0)`);
      glow.addColorStop(.45, `rgba(${i===1?'85,110,255':'92,79,220'},.055)`);
      glow.addColorStop(1, `rgba(${i===1?'85,110,255':'92,79,220'},0)`);
      ctx.strokeStyle = glow;
      ctx.lineWidth = 24 + i*10;
      ctx.shadowBlur = 0;
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
    if (!reduced) raf = requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize, {passive:true});
  resize();
  draw(0);
})();

// Keep the supplied soundtrack; browsers may still require prior interaction for audible autoplay.
(() => {
  const audio = document.getElementById('site-music');
  if (!audio) return;
  audio.volume = 0.35;
  const play = () => audio.play().catch(() => {});
  play();
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && audio.paused) play();
  });
})();

</script>
