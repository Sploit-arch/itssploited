<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>13.52 Exploit</title>
<style>
  :root {
    --bg: #07090d;
    --panel: rgba(16, 20, 28, .82);
    --panel-strong: rgba(20, 25, 35, .94);
    --border: rgba(255,255,255,.09);
    --text: #f4f7fb;
    --muted: #8d98a8;
    --accent: #8b5cf6;
    --accent-2: #22d3ee;
    --ok: #34d399;
    --bad: #fb7185;
    --warn: #fbbf24;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background:
      radial-gradient(circle at 50% -10%, rgba(139,92,246,.20), transparent 38%),
      radial-gradient(circle at 90% 90%, rgba(34,211,238,.08), transparent 30%),
      var(--bg);
    color: var(--text);
    font: 15px/1.5 "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
    background-size: 32px 32px;
    mask-image: linear-gradient(to bottom, black, transparent 80%);
  }

  #brand {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 66px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: rgba(7,9,13,.72);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
  }

  #brand::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -1px;
    width: 110px;
    height: 1px;
    transform: translateX(-50%);
    background: linear-gradient(90deg, transparent, var(--accent), var(--accent-2), transparent);
    box-shadow: 0 0 14px rgba(139,92,246,.65);
  }

  #brand b {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: .18em;
    color: #eef2ff;
    text-transform: uppercase;
  }

  #wrap {
    position: relative;
    width: min(680px, calc(100% - 32px));
    margin: auto;
    padding: 34px 0 42px;
  }

  #wrap::before {
    content: "";
    position: absolute;
    inset: 18px -1px 0;
    border: 1px solid var(--border);
    border-radius: 28px;
    background: linear-gradient(145deg, rgba(255,255,255,.055), rgba(255,255,255,.018));
    box-shadow:
      0 28px 80px rgba(0,0,0,.42),
      inset 0 1px rgba(255,255,255,.035);
    pointer-events: none;
  }

  #state, #det, #cache {
    position: relative;
    z-index: 1;
    margin-left: 34px;
    margin-right: 34px;
  }

  #state {
    margin-top: 38px;
    margin-bottom: 12px;
    font-size: clamp(25px, 5vw, 38px);
    line-height: 1.08;
    letter-spacing: -.035em;
    font-weight: 800;
    color: #fff;
    text-wrap: balance;
  }

  #state::before {
    content: "";
    display: block;
    width: 42px;
    height: 4px;
    margin-bottom: 20px;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 18px rgba(139,92,246,.55);
  }

  #det {
    display: inline-block;
    margin-bottom: 10px;
    padding: 7px 11px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: rgba(255,255,255,.035);
    color: var(--muted);
    font-size: 12px;
    letter-spacing: .02em;
  }

  #det b { color: #dce3ef; font-weight: 700; }

  #cache {
    min-height: 20px;
    margin-bottom: 38px;
    color: #687487;
    font-size: 12px;
  }

  #cache.cacheok { color: var(--ok); }

  .ok { color: var(--ok); }
  .bad { color: var(--bad); }
  .warn { color: var(--warn); }

  @media (max-width: 520px) {
    #brand { min-height: 58px; }
    #brand b { font-size: 11px; letter-spacing: .12em; }
    #wrap { width: min(100% - 20px, 680px); padding-top: 20px; }
    #wrap::before { inset: 10px 0 0; border-radius: 22px; }
    #state, #det, #cache { margin-left: 24px; margin-right: 24px; }
    #state { margin-top: 30px; font-size: 28px; }
  }
</style>
</head>
<body>
<div id="brand"><b>ItsSploited · AIO Fix / Goldhen</b></div>
<div id="wrap">
  <div id="state">Detecting what if i can skid your console...</div>
  <div id="det"></div>
  <div id="cache"></div>
</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    var params = new URLSearchParams(location.search);

    // Firmwares this build has a MEASURED kernel table for. jb.js still runs its
    // own kernel-table-present gate, so this is UX only -- an unlisted firmware
    // can still be launched with a tap. KEEP IN SYNC with ps4_offsets.js: add a
    // fwnum here in the SAME commit that fills that firmware's kernel RVAs.
    // The PS4 reports its minor as two hex digits in the UA (13.52 -> minor 0x52).
    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 }; // all measured on hardware

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var forced = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);
    detEl.innerHTML = "firmware <b>" + (key || "unknown") + "</b>"
        + (supported ? " &middot; <b>supported</b>"
                     : " &middot; not in this build's kernel table");

    var target = "jb.html" + location.search;
    function go() { setState("Skidding your kernel...", "warn"); location.replace(target); }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    // Off-target consoles are not launched automatically -- one tap still runs
    // it, so a user-agent quirk on the real 13.52 console can never lock it out.
    if (!supported) {
        setState("Looks like i cant fuck up the ps4", "bad");
        waitForTap("UNSUPPORTED (" + (key || "unknown") + ") -- press X or tap to run anyway", go);
        return;
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("offline -- from cache", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("cached", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("update downloaded", true);
        waitForTap("UPDATE READY -- press X or tap to reload & run",
                   function () { location.reload(); });
    } else {
        setCache("checking cache...");
        ac.addEventListener("downloading",
            function () { setCache("caching for offline (first run)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("caching " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);
        ac.addEventListener("cached", function () {
            setCache("cached for offline use", true);
            waitForTap("CACHED (first run) -- press X or tap to run", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("update downloaded", true);
            waitForTap("UPDATE READY -- press X or tap to reload & run",
                       function () { location.reload(); });
        }, false);
        ac.addEventListener("noupdate", function () {
            setCache("cached -- offline ready", true);
            go();
        }, false);
        ac.addEventListener("error", function () {
            setCache("cache unavailable");
            waitForTap("CACHE FAILED -- press X or tap to run anyway", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("cache obsolete");
            waitForTap("CACHE OBSOLETE -- press X or tap to run", go);
        }, false);
    }
})();
</script>
</body>
</html>
