<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>13.52 Exloit</title>
    <style>
  :root {
    --bg: #07090d;
    --panel: rgba(16, 20, 28, .84);
    --panel-2: rgba(20, 25, 35, .96);
    --border: rgba(255,255,255,.09);
    --text: #f4f7fb;
    --muted: #8d98a8;
    --accent: #8b5cf6;
    --accent-2: #22d3ee;
    --ok: #34d399;
    --bad: #fb7185;
    --warn: #fbbf24;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background:
      radial-gradient(circle at 50% -12%, rgba(139,92,246,.22), transparent 38%),
      radial-gradient(circle at 92% 88%, rgba(34,211,238,.08), transparent 30%),
      var(--bg);
    color: var(--text);
    font: 15px/1.5 "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  }

  body {
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,.017) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.017) 1px, transparent 1px);
    background-size: 32px 32px;
    mask-image: linear-gradient(to bottom, black, transparent 82%);
  }

  #brand {
    position: relative;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 66px;
    padding: 14px 20px;
    background: rgba(7,9,13,.72);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
  }

  #brand::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -1px;
    width: 110px;
    height: 1px;
    transform: translateX(-50%);
    background: linear-gradient(90deg, transparent, var(--accent), var(--accent-2), transparent);
    box-shadow: 0 0 14px rgba(139,92,246,.65);
  }

  #brand b {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: .18em;
    color: #eef2ff;
    text-transform: uppercase;
  }

  #spin {
    position: fixed;
    top: calc(50% + 12px);
    left: 50%;
    width: 58px;
    height: 58px;
    margin: -29px 0 0 -29px;
    border: 3px solid rgba(255,255,255,.08);
    border-top-color: var(--accent);
    border-right-color: var(--accent-2);
    border-radius: 50%;
    animation: spin .85s linear infinite;
    box-shadow:
      0 0 28px rgba(139,92,246,.22),
      inset 0 0 20px rgba(34,211,238,.06);
  }

  #spin::after {
    content: "";
    position: absolute;
    inset: 7px;
    border: 1px solid rgba(255,255,255,.06);
    border-radius: 50%;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  #msg {
    position: fixed;
    z-index: 2;
    top: 50%;
    left: 50%;
    width: min(680px, calc(100% - 32px));
    transform: translate(-50%, 42px);
    padding: 28px 24px;
    text-align: center;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    border: 1px solid var(--border);
    border-radius: 22px;
    background: var(--panel);
    box-shadow: 0 28px 80px rgba(0,0,0,.45);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    display: none;
  }

  #wrap {
    width: min(900px, calc(100% - 32px));
    margin: 28px auto;
    padding: 26px;
    border: 1px solid var(--border);
    border-radius: 26px;
    background: linear-gradient(145deg, rgba(255,255,255,.055), rgba(255,255,255,.018));
    box-shadow: 0 28px 80px rgba(0,0,0,.42), inset 0 1px rgba(255,255,255,.035);
  }

  #state {
    display: none;
    margin: 0 0 16px;
    font-size: clamp(24px, 4vw, 34px);
    line-height: 1.1;
    font-weight: 800;
    letter-spacing: -.035em;
  }

  #state::before {
    content: "";
    display: block;
    width: 42px;
    height: 4px;
    margin-bottom: 18px;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 18px rgba(139,92,246,.55);
  }

  #out {
    display: none;
    white-space: pre-wrap;
    font: 12px/1.55 "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    color: #c9d2df;
    background: rgba(5,8,12,.72);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    height: calc(100vh - 175px);
    min-height: 320px;
    overflow-y: auto;
    box-shadow: inset 0 1px rgba(255,255,255,.025);
  }

  #out::-webkit-scrollbar { width: 8px; }
  #out::-webkit-scrollbar-track { background: transparent; }
  #out::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,.12);
    border-radius: 999px;
  }

  body.done #spin,
  body.fail #spin { display: none; }

  body.fail #msg {
    display: block;
    color: var(--bad);
    border-color: rgba(251,113,133,.18);
  }

  body.done #msg {
    display: block;
    color: var(--ok);
    border-color: rgba(52,211,153,.18);
  }

  body.log #spin,
  body.log #msg { display: none; }

  body.log #wrap {
    margin-top: 24px;
  }

  body.log #state {
    display: block;
  }

  body.log #out {
    display: block;
  }

  .ok, .safe { color: var(--ok); }
  .bad, .danger { color: var(--bad); }
  .warn { color: var(--warn); }

  code {
    color: #b9c8e0;
    background: rgba(255,255,255,.045);
    padding: 2px 5px;
    border-radius: 5px;
  }

  @media (max-width: 600px) {
    #brand { min-height: 58px; }
    #brand b { font-size: 11px; letter-spacing: .12em; }
    #wrap {
      width: calc(100% - 20px);
      margin: 18px auto;
      padding: 18px;
      border-radius: 21px;
    }
    #out { height: calc(100vh - 145px); padding: 14px; }
    #msg { width: calc(100% - 24px); }
  }
</style>
  </head>
  <body>
    <div id="brand">
      <b>ItsSploited · AIO Fix / Goldhen</b>
    </div>
    <div id="spin"></div>
    <div id="msg">Restart your console</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <script type="module">
      import "./jb.js?v=19";
    </script>
  </body>
</html>
